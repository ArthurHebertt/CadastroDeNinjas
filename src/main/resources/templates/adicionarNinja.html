
<html>
<head>
    <meta charset="UTF-8">
    <title>Adicionar Ninja</title> <style>/* Reset básico */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #f8fafc;
}

/* Card do formulário */
form {
    background: #ffffff;
    color: #1e293b;
    width: 100%;
    max-width: 500px;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);

    display: flex;
    flex-direction: column;
    gap: 15px;
}

h1 {
    position: absolute;
    top: 40px;
    text-align: center;
    color: white;
    font-size: 2rem;
    font-weight: 700;
}

/* Labels */
label {
    font-weight: 600;
    color: #334155;
}

/* Inputs */
input {
    padding: 12px 15px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s ease;
}

input:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
}

/* Botão */
button {
    margin-top: 10px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
}

button:active {
    transform: translateY(0);
}

/* Responsividade */
@media (max-width: 600px) {
    form {
        width: 90%;
        padding: 25px;
    }

    h1 {
        font-size: 1.6rem;
    }
}</style>
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>
<body>
<h1></h1>
<form th:action="@{/ninjas/ui/criar}" th:object="${ninja}" method="post">

    <label for="nome" >Nome :</label>
    <input type="text" th:field="*{nome}">

    <label for="email"  >Email :</label>
    <input type="email" th:field="*{email}">

    <label for="idade" >Idade :</label>
    <input type="number" th:field="*{idade}">

    <label for="rank" >Rank :</label>
    <input type="text" th:field="*{rank}">

    <label for="imgUrl" >URL da imagem :</label>
    <input type="url" th:field="*{imgUrl}">

    <button type="submit">Salvar</button>
</form>

</body>
</html>
